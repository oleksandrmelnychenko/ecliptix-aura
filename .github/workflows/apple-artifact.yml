name: Apple Artifact

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      # Source identity v2 covers almost every tracked file. Keep this workflow
      # global until a future identity schema defines a narrower build-input set.
      - "**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "crates/**"
      - "include/**"
      - "models/manifest.json"
      - "dist/apple/**"
      - "scripts/release/**"
      - "ci/apple_artifact.py"
      - "ci/test_apple_artifact.py"
      - "ci/apple_artifact_reproducibility.py"
      - "ci/test_apple_artifact_reproducibility.py"
      - ".github/workflows/apple-artifact.yml"

concurrency:
  group: apple-artifact-${{ github.event.pull_request.head.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  xcframework:
    runs-on: macos-15
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      CARGO_BUILD_JOBS: "10"
      CARGO_NET_OFFLINE: "true"
      PROFILE: release
      AURA_AGENT_ONNX: "0"
      MINIMUM_IOS_VERSION: "18.0"

    steps:
      - name: Preflight runner capacity before LFS materialization
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import shutil

          minimum_free_bytes = 35 * 1024**3
          free_bytes = shutil.disk_usage(os.environ["RUNNER_TEMP"]).free
          print(f"runner free bytes before checkout: {free_bytes}")
          if free_bytes < minimum_free_bytes:
              raise SystemExit(
                  "Apple reproducibility verification requires at least 35 GiB free"
              )
          PY

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          lfs: true
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.96.1
          components: llvm-tools-preview
          targets: >-
            aarch64-apple-ios,
            aarch64-apple-ios-sim,
            x86_64-apple-ios,
            aarch64-apple-ios-macabi,
            x86_64-apple-ios-macabi

      - name: Verify pinned Apple toolchain and runner capacity
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_XCODE=$'Xcode 26.2\nBuild version 17C52'
          OBSERVED_XCODE="$(xcodebuild -version)"
          if [[ "$OBSERVED_XCODE" != "$EXPECTED_XCODE" ]]; then
            printf 'Unexpected Xcode identity:\n%s\n' "$OBSERVED_XCODE" >&2
            exit 1
          fi

          if [[ "$(xcrun --sdk iphoneos --show-sdk-version)" != "26.2" ]]; then
            echo "Expected iPhoneOS SDK 26.2." >&2
            exit 1
          fi
          if [[ "$(xcrun --sdk iphoneos --show-sdk-build-version)" != "23C53" ]]; then
            echo "Expected iPhoneOS SDK build 23C53." >&2
            exit 1
          fi

          RUSTC_DETAILS="$(rustc -vV)"
          for EXPECTED_RUSTC_FIELD in \
            "release: 1.96.1" \
            "commit-hash: 31fca3adb283cc9dfd56b49cdee9a96eb9c96ffd" \
            "LLVM version: 22.1.2"; do
            if ! grep -Fqx "$EXPECTED_RUSTC_FIELD" <<<"$RUSTC_DETAILS"; then
              printf 'Unexpected rustc identity:\n%s\n' "$RUSTC_DETAILS" >&2
              exit 1
            fi
          done

      - name: Test Apple provenance helpers
        run: python3 -m unittest discover -s ci -p 'test_apple_artifact*.py'

      - name: Verify checked-in source and binary provenance
        run: |
          python3 ci/apple_artifact.py verify \
            --root . \
            --dist-dir dist/apple \
            --output artifacts/apple-release-verification.json \
            --require-clean-source

      - name: Fetch locked Rust dependencies for offline rebuilds
        if: ${{ github.event_name != 'pull_request' }}
        env:
          CARGO_NET_OFFLINE: "false"
        shell: bash
        run: |
          set -euo pipefail
          cargo fetch --locked
          for TARGET in \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios \
            aarch64-apple-ios-macabi \
            x86_64-apple-ios-macabi; do
            cargo fetch --locked --target "$TARGET"
          done

      - name: Reproduce checked-in Apple artifact twice
        if: ${{ github.event_name != 'pull_request' }}
        run: python3 ci/apple_artifact_reproducibility.py verify --root . --output artifacts/apple-reproducibility.json --temporary-parent "$RUNNER_TEMP"

      - name: Upload verified Apple release artifact
        if: ${{ github.event_name != 'pull_request' && success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aura-agent-apple-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            artifacts/apple-verified-dist
            artifacts/apple-release-verification.json
            artifacts/apple-reproducibility.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
