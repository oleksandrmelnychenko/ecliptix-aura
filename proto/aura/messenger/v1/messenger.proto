message AuraExecutionRule {
  string rule_id = 1;
  AuraExecutionRiskFamily risk_family = 2;
  AuraExecutionCaseTrigger trigger = 3;
  AuraExecutionCaseStatus required_case_status = 4;
  AuraExecutionSeverity minimum_severity = 5;
  AuraExecutionConfidence minimum_confidence = 6;
  uint32 minimum_observation_count = 7;
  uint32 minimum_peak_risk_bps = 8;
  uint64 cooldown_ms = 9;
  bool urgent_bypasses_cooldown = 10;
  uint32 max_report_reason_codes = 11;
  uint32 max_evidence_commitments = 12;
  repeated string allowed_report_reason_codes = 13;
  AuraExecutionDeliveryClass delivery_class = 14;
  bytes rule_digest = 15;
}

// Wire-compatible copy of the server-signed execution-policy document. The
// FFI rejects non-canonical protobuf bytes and verifies the Ed25519 signature
// against the exact compile-time execution-policy trust keyring.
message AuraExecutionPolicyDocument {
  uint32 schema_version = 1;
  AuraExecutionPolicySignatureAlgorithm signature_algorithm = 2;
  string authority_lineage_id = 3;
  string issuer_key_id = 4;
  bytes protected_account_id = 5;
  uint64 policy_epoch = 6;
  uint64 revoked_through_policy_epoch = 7;
  AuraExecutionPolicyState state = 8;
  string policy_version = 9;
  bytes policy_body_digest = 10;
  uint64 safety_profile_authority_epoch = 11;
  bytes safety_profile_assertion_digest = 12;
  AuraExecutionAccountProfile account_profile = 13;
  AuraExecutionMode execution_mode = 14;
  repeated string language_tags = 15;
  AuraExecutionDomainMode domain_mode = 16;
  bytes runtime_capabilities_digest = 17;
  bytes model_manifest_digest = 18;
  uint32 safety_case_policy_schema_version = 19;
  uint32 required_guardian_report_schema_version = 20;
  uint32 required_delivery_operation_schema_version = 21;
  uint64 case_state_ttl_ms = 22;
  uint32 max_case_observations = 23;
  uint32 max_case_reason_codes = 24;
  repeated AuraExecutionRule rules = 25;
  string rollout_id = 26;
  string cohort_id = 27;
  uint64 issued_at_ms = 28;
  uint64 valid_from_ms = 29;
  uint64 valid_until_ms = 30;
  uint64 policy_updated_at_ms = 31;
  bytes signature = 32;
}

message AuraExecutionPolicyApplyRequest {
  string account_key = 1;
  bytes policy_wire = 2;
  bytes expected_policy_wire_digest = 3;
  bytes expected_runtime_capabilities_digest = 4;
  bytes expected_model_manifest_digest = 5;
  int64 authenticated_server_time_unix_ms = 6;
  bytes expected_execution_policy_trust_keyring_digest = 7;
}

enum AuraExecutionPolicyApplyDisposition {
  AURA_EXECUTION_POLICY_APPLY_DISPOSITION_UNSPECIFIED = 0;
  AURA_EXECUTION_POLICY_APPLY_DISPOSITION_APPLIED = 1;
  AURA_EXECUTION_POLICY_APPLY_DISPOSITION_UNCHANGED = 2;
}

message AuraExecutionPolicyApplicationReceipt {
  uint32 schema_version = 1;
  AuraExecutionPolicyApplyDisposition disposition = 2;
  string account_key = 3;
  bytes protected_account_id = 4;
  uint64 policy_epoch = 5;
  bytes policy_wire_digest = 6;
  AuraExecutionPolicyState state = 7;
  AuraExecutionMode execution_mode = 8;
  bytes runtime_capabilities_digest = 9;
  bytes model_manifest_digest = 10;
  uint64 native_floor_epoch = 11;
  bytes native_floor_policy_wire_digest = 12;
  bytes signed_policy_digest = 13;
  bytes receipt_digest = 14;
  string runtime_state_schema_version = 15;
  bytes execution_policy_trust_keyring_digest = 16;
}

enum MediaVerdictClass {
  MEDIA_VERDICT_CLASS_UNSPECIFIED = 0;
  MEDIA_VERDICT_CLASS_NEUTRAL = 1;
  MEDIA_VERDICT_CLASS_SUGGESTIVE = 2;
  MEDIA_VERDICT_CLASS_EXPLICIT = 3;
  MEDIA_VERDICT_CLASS_DRAWING = 4;
  MEDIA_VERDICT_CLASS_UNCLEAR = 5;
}

// Metadata about a media attachment. The runtime never receives original
// media bytes — image_data carries a client-downscaled thumbnail only.
message MediaInfo {
  uint32 width = 1;
  uint32 height = 2;
  string mime_type = 3;
  uint64 original_size_bytes = 4;
  // Video keyframe sampling: which sampled frame this input represents.
  uint32 keyframe_index = 5;
  uint32 keyframe_count = 6;
}

// Pre-computed sensitive-content verdict from a platform-native classifier
// (e.g. Apple SensitiveContentAnalysis). The core validates and consumes it
// instead of re-classifying on platforms that provide one.
message ClientVisionVerdict {
  MediaVerdictClass verdict_class = 1;
  // Calibrated confidence in [0.0, 1.0].
  float confidence = 2;
  // Verdict provider identifier, e.g. "apple.sca".
  string provider = 3;
}

message MessageInput {
  ContentType content_type = 1;
  optional string text = 2;
  optional bytes image_data = 3;
  string sender_id = 4;
  string conversation_id = 5;
  optional string language = 6;
  ConversationType conversation_type = 7;
  optional uint32 member_count = 8;
  reserved 9;
  reserved "server_sender_risk_hint";
  // Coarse, privacy-preserving sender relationship category.
  SenderRelationship sender_relationship = 10;
  // Source used to derive sender_relationship. Self-declared data is not trust.
  RelationshipTrustSource relationship_trust_source = 11;
  optional MediaInfo media_info = 12;
  optional ClientVisionVerdict client_vision_verdict = 13;
}

