[package]
name = "aura-military"
version.workspace = true
edition.workspace = true
description = "AURA.MILITARY domain module"

[features]
default = []
shadow-telemetry = ["dep:thiserror"]
evaluation = ["shadow-telemetry", "dep:sha2"]

[dependencies]
aura-domain = { path = "../aura-domain" }
serde.workspace = true
serde_json.workspace = true
regex.workspace = true
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }

[[example]]
name = "temporal_shadow_eval"
path = "examples/temporal_shadow_eval.rs"
required-features = ["evaluation"]

[[example]]
name = "temporal_independent_review"
path = "examples/temporal_independent_review.rs"
required-features = ["evaluation"]

[[example]]
name = "temporal_shadow_telemetry"
path = "examples/temporal_shadow_telemetry.rs"
required-features = ["shadow-telemetry"]

[[example]]
name = "temporal_shadow_telemetry_validation"
path = "examples/temporal_shadow_telemetry_validation.rs"
required-features = ["evaluation"]
