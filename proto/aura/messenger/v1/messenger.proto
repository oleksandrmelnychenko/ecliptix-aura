}

enum RelayPrivacyMode {
  RELAY_PRIVACY_MODE_UNSPECIFIED = 0;
  // Send no plaintext message body to the relay.
  RELAY_PRIVACY_MODE_METADATA_ONLY = 1;
  // Send only the current message body when relay is queried.
  RELAY_PRIVACY_MODE_MESSAGE_ONLY = 2;
  // Send current message body plus bounded recent window when configured.
  RELAY_PRIVACY_MODE_MESSAGE_AND_WINDOW = 3;
}

