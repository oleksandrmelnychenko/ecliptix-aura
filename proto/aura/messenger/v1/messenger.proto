  RELATIONSHIP_TRUST_SOURCE_ADDRESS_BOOK = 5;
  RELATIONSHIP_TRUST_SOURCE_SCHOOL_DIRECTORY = 6;
  RELATIONSHIP_TRUST_SOURCE_SERVER_REPUTATION = 7;
  RELATIONSHIP_TRUST_SOURCE_LOCAL_HEURISTIC = 8;
  RELATIONSHIP_TRUST_SOURCE_SELF_DECLARED = 9;
