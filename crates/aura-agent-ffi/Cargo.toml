[package]
name = "aura-agent-ffi"
version.workspace = true
edition.workspace = true
description = "C FFI surface for AURA Agent runtime (Android NDK, iOS, Desktop)"

[features]
default = []
onnx = ["aura-agent-core/onnx"]

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
aura-agent-core = { path = "../aura-agent-core" }
aura-proto = { path = "../aura-proto" }
aura-patterns = { path = "../aura-patterns" }
ed25519-dalek.workspace = true
prost.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true

[dev-dependencies]
chrono = { version = "0.4", features = ["serde"] }
serde.workspace = true
serde_json.workspace = true
