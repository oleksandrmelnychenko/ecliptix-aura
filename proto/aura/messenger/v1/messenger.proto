}

message TrackerState {
  uint32 schema_version = 1;
  repeated ConversationTimelineState timelines = 2;
  ContactProfilerState contact_profiler = 3;
  // Kids domain memory state for export/import (conversation + sender tracking).
  KidsMemoryState kids_memory = 4;
}

// Per-message risk snapshot within kids conversation memory.
message KidsMessageRiskSnapshot {
  optional string sender_id = 1;
  bool has_grooming = 2;
  bool has_manipulation = 3;
  bool has_bullying = 4;
  bool has_self_harm = 5;
  bool has_blackmail_or_sextortion = 6;
  // ML safety scores at the time of this message (0.0 if ML was not available).
  float ml_grooming = 7;
  float ml_bullying = 8;
  float ml_self_harm = 9;
  float ml_manipulation = 10;
}

// Per-conversation risk memory in kids module.
message KidsConversationMemoryState {
  string conversation_id = 1;
  repeated KidsMessageRiskSnapshot entries = 2;
  uint64 message_index = 3;
  // Exact process-wide LRU position. Absent in legacy kids state.
  optional uint64 last_activity_index = 4;
  // Per-reason emission checkpoints used to preserve alert cooldowns.
  repeated KidsEmissionCheckpoint last_emitted = 5;
}

// Per-sender cross-conversation risk memory in kids module.
message KidsSenderMemoryState {
  string sender_id = 1;
  uint64 event_index = 2;
  repeated string recent_high_risk_conversations = 3;
  // Exact process-wide LRU position. Absent in legacy kids state.
  optional uint64 last_activity_index = 4;
  // Per-reason emission checkpoints used to preserve alert cooldowns.
  repeated KidsEmissionCheckpoint last_emitted = 5;
}

// Monotonic checkpoint for one kids-memory alert family.
message KidsEmissionCheckpoint {
  string reason_code = 1;
  uint64 emitted_at_index = 2;
}

// Full kids memory state for export/import.
message KidsMemoryState {
  repeated KidsConversationMemoryState conversations = 1;
  repeated KidsSenderMemoryState senders = 2;
  // 0 identifies legacy state emitted before this nested schema was versioned.
  uint32 schema_version = 3;
}
