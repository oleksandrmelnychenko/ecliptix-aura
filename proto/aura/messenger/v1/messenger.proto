syntax = "proto3";

package aura.messenger.v1;

// AuraAgent is imported beside the application's independently generated
// AuraProtos module. A distinct prefix prevents public Swift symbols for the
// same wire schema from becoming ambiguous at the integration boundary.
option swift_prefix = "AuraAgentNative";

