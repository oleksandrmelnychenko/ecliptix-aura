enum SafetyTelemetryAction {
  SAFETY_TELEMETRY_ACTION_UNSPECIFIED = 0;
  SAFETY_TELEMETRY_ACTION_NONE = 1;
  SAFETY_TELEMETRY_ACTION_MARK = 2;
  SAFETY_TELEMETRY_ACTION_BLUR = 3;
  SAFETY_TELEMETRY_ACTION_WARN = 4;
  SAFETY_TELEMETRY_ACTION_BLOCK = 5;
  SAFETY_TELEMETRY_ACTION_GUARDIAN_ALERT = 6;
  SAFETY_TELEMETRY_ACTION_REPORT_QUEUED = 7;
  SAFETY_TELEMETRY_ACTION_RESTRICT_CONTACT = 8;
  SAFETY_TELEMETRY_ACTION_CRISIS_SUPPORT = 9;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_FLATTERY = 1;
  EVENT_KIND_GIFT_OFFER = 2;
  EVENT_KIND_SECRECY_REQUEST = 3;
  EVENT_KIND_PLATFORM_SWITCH = 4;
  EVENT_KIND_PERSONAL_INFO_REQUEST = 5;
  EVENT_KIND_PHOTO_REQUEST = 6;
  EVENT_KIND_VIDEO_CALL_REQUEST = 7;
  EVENT_KIND_FINANCIAL_GROOMING = 8;
  EVENT_KIND_MEETING_REQUEST = 9;
