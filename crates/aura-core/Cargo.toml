[package]
name = "aura-core"
version.workspace = true
edition.workspace = true
description = "Core analysis engine for AURA protection system"

[features]
default = []
onnx = ["aura-ml/onnx"]

[dependencies]
aura-domain = { path = "../aura-domain" }
aura-kids = { path = "../aura-kids" }
aura-military = { path = "../aura-military" }
aura-patterns = { path = "../aura-patterns" }
aura-ml = { path = "../aura-ml" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono = { version = "0.4", features = ["serde"] }
aho-corasick = "1"
sha2.workspace = true
getrandom = "0.2"
regex.workspace = true

[dev-dependencies]
aura-proto = { path = "../aura-proto" }
criterion = "0.5"
prost = "0.13"

[[bench]]
name = "analyze"
path = "benches/analyze_bench.rs"
harness = false
