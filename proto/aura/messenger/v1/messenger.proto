syntax = "proto3";

package aura.messenger.v1;

enum ProtectionLevel {
  PROTECTION_LEVEL_UNSPECIFIED = 0;
  PROTECTION_LEVEL_OFF = 1;
  PROTECTION_LEVEL_LOW = 2;
  PROTECTION_LEVEL_MEDIUM = 3;
  PROTECTION_LEVEL_HIGH = 4;
}

enum AccountType {
  ACCOUNT_TYPE_UNSPECIFIED = 0;
  ACCOUNT_TYPE_ADULT = 1;
  ACCOUNT_TYPE_TEEN = 2;
  ACCOUNT_TYPE_CHILD = 3;
}

enum DomainMode {
  DOMAIN_MODE_UNSPECIFIED = 0;
  // Base Aura only (no domain extension).
  DOMAIN_MODE_NONE = 1;
  // Base Aura + Kids domain extension.
  DOMAIN_MODE_KIDS = 2;
  // Base Aura + Military domain extension.
  DOMAIN_MODE_MILITARY = 3;
}

