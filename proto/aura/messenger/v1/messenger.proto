message AuraConfig {
  ProtectionLevel protection_level = 1;
  AccountType account_type = 2;
  string language = 3;
  CulturalContext cultural_context = 4;
  bool enabled = 5;
  optional string patterns_path = 6;
  optional string models_path = 7;
  optional uint32 account_holder_age = 8;
  uint32 ttl_days = 9;
  int32 timezone_offset_minutes = 10;
  // Account-level domain mode and the only effective domain selector.
  DomainMode domain_mode = 11;
  optional AgentRelayPolicy relay_policy = 12;
  // Product delivery rollout. Unspecified is interpreted as shadow mode.
  ProductRolloutMode product_rollout_mode = 13;
}

// The inference implementation that is actually active in this runtime.
enum RuntimeBackend {
  RUNTIME_BACKEND_UNSPECIFIED = 0;
  RUNTIME_BACKEND_RULES_FALLBACK = 1;
  RUNTIME_BACKEND_ONNX = 2;
}

// Input modalities implemented by this runtime build.
enum RuntimeModality {
  RUNTIME_MODALITY_UNSPECIFIED = 0;
  RUNTIME_MODALITY_TEXT = 1;
  RUNTIME_MODALITY_URL = 2;
}

// Identity of an inference model that was successfully loaded.
message RuntimeModelIdentity {
  string component = 1;
  string identifier = 2;
  // Present only when the runtime can attest the loaded artifact hash.
  optional string sha256 = 3;
}

// Read-only, versioned description of the initialized runtime.
message RuntimeCapabilities {
  string schema_version = 1;
  string runtime_version = 2;
  RuntimeBackend backend = 3;
  repeated RuntimeModality supported_modalities = 4;
  repeated RuntimeModelIdentity models = 5;
  string policy_schema_version = 6;
  string product_schema_version = 7;
  uint32 state_schema_version = 8;
  ProductRolloutMode product_rollout_mode = 9;
}

message AgentRelayPolicy {
  optional bool enabled = 1;
  optional float score_threshold = 2;
  optional bool send_on_high_uncertainty = 3;
  optional bool send_on_new_contact = 4;
  optional bool send_on_repeated_sender = 5;
  RelayPrivacyMode privacy_mode = 6;
  optional uint32 max_recent_window_messages = 7;
  // 0 means no deadline.
  optional uint32 deadline_ms = 8;
  optional bool emit_local_safety_telemetry = 9;
  // Raw local account id. AURA tokenizes it before any relay request.
  optional string protected_account_id = 10;
  // Host-provisioned response MAC key. When present, Agent rejects unsigned
  // or tampered RelayAnalyzeResponse envelopes for pending relay requests.
  optional RelayResponseAuthKey response_auth_key = 11;
  // Host-provisioned request MAC key. When present, Agent signs
  // RelayAnalyzeRequest envelopes and Relay can reject unsigned or replayed
  // requests.
  optional RelayRequestAuthKey request_auth_key = 12;
  // Additional response MAC keys accepted during key rotation. The primary
  // response_auth_key is also accepted.
  repeated RelayResponseAuthKey accepted_response_auth_keys = 13;
  // Production guardrail: fail config/init unless both request signing and
  // response verification keys are provisioned.
  optional bool require_relay_auth = 14;
  // Optional short-lived server-issued proof for the tokenized protected
  // account. The Agent includes it in RelayAnalyzeRequest only when it matches
  // the configured protected_account_id after tokenization and is not expired.
  optional ProtectedAccountTokenAttestation protected_account_attestation = 15;
  // Production guardrail: fail config/init unless protected_account_id has a
  // matching protected_account_attestation. At runtime, suppress relay requests
  // if the proof is expired or mismatched.
  optional bool require_protected_account_attestation = 16;
}

message RelayResponseAuthKey {
  string key_id = 1;
  bytes secret = 2;
}

message RelayRequestAuthKey {
  string key_id = 1;
  bytes secret = 2;
}

message MessageInput {
  ContentType content_type = 1;
  optional string text = 2;
  optional bytes image_data = 3;
  string sender_id = 4;
  string conversation_id = 5;
  optional string language = 6;
  ConversationType conversation_type = 7;
  optional uint32 member_count = 8;
  // Server-injected sender reputation hint (0.0 = unknown, 1.0 = max risk).
  // Allows the server to feed cross-user reputation signals back to the client.
  optional float server_sender_risk_hint = 9;
  // Coarse, privacy-preserving sender relationship category.
  SenderRelationship sender_relationship = 10;
  // Source used to derive sender_relationship. Self-declared data is not trust.
  RelationshipTrustSource relationship_trust_source = 11;
}

message AnalyzeContextRequest {
  MessageInput message = 1;
  uint64 timestamp_ms = 2;
}

message RelayObservation {
  ThreatType threat_type = 1;
  string threat_subtype = 2;
  DetectionLayer layer = 3;
  float score = 4;
  Confidence confidence = 5;
  string reason_code = 6;
  string explanation = 7;
}

message RelayMessageWindowEntry {
  string sender_id = 1;
  string text = 2;
  uint64 timestamp_ms = 3;
}

message RelayLocalContextSummary {
  repeated string context_markers = 1;
  repeated RelayObservation recent_observations = 2;
}

message RelayAgentCapabilities {
  bool local_context_interpreter = 1;
  bool local_tracker = 2;
  bool supports_remote_correlation = 3;
  optional uint32 relay_timeout_ms = 4;
}

message RelaySafetyTelemetryEvent {
  string event_id = 1;
  string sender_token = 2;
  string protected_account_token = 3;
  optional string conversation_token = 4;
  SafetyTelemetrySurface surface = 5;
  ThreatType threat_type = 6;
  SafetyTelemetrySeverity severity = 7;
  Confidence confidence = 8;
  SafetyTelemetryAction action = 9;
  uint64 timestamp_bucket_ms = 10;
  optional string reason_family = 11;
}

message RelayRequestAuth {
  string key_id = 1;
  string alg = 2;
  string tag = 3;
}

message ProtectedAccountTokenAttestation {
  string key_id = 1;
  string alg = 2;
  string protected_account_token = 3;
  uint64 expires_at_ms = 4;
  string tag = 5;
}

message RelayAnalyzeRequest {
  string schema_version = 1;
  string request_id = 2;
  string message_id = 3;
  AccountType account_type = 4;
  ProtectionLevel protection_level = 5;
  ConversationType conversation_type = 6;
  optional string language = 7;
  string text = 8;
  repeated RelayObservation local_observations = 9;
  RelayLocalContextSummary local_context_summary = 10;
  repeated RelaySafetyTelemetryEvent local_safety_telemetry = 11;
  repeated RelayMessageWindowEntry recent_message_window = 12;
  optional float server_sender_risk_hint = 13;
  RelayPrivacyMode privacy_mode = 14;
  RelayAgentCapabilities capabilities = 15;
  optional uint32 deadline_ms = 16;
  optional string sender_token = 17;
  optional string protected_account_token = 18;
  optional string conversation_token = 19;
  RelayRequestAuth auth = 20;
  ProtectedAccountTokenAttestation protected_account_attestation = 21;
  // Coarse, privacy-preserving sender relationship category.
  SenderRelationship sender_relationship = 22;
  // Source used to derive sender_relationship. Self-declared data is not trust.
  RelationshipTrustSource relationship_trust_source = 23;
}

message RelayRemoteFinding {
  ThreatType threat_type = 1;
  float score = 2;
  Confidence confidence = 3;
  string reason_code = 4;
  string explanation = 5;
}

message RelayRemoteInferenceSummary {
  ThreatType primary_threat = 1;
  float score = 2;
  Confidence confidence = 3;
  RiskHorizon risk_horizon = 4;
}

message RelayResponseAuth {
  string key_id = 1;
  string alg = 2;
  string tag = 3;
}

message RelayAnalyzeResponse {
  string schema_version = 1;
  string request_id = 2;
  repeated RelayObservation remote_observations = 3;
  // Field 4 is reserved for a future typed remote context frame.
  repeated ContextEvent remote_events = 5;
  repeated RelayRemoteFinding findings = 6;
  RelayRemoteInferenceSummary inference = 7;
  repeated string reason_codes = 8;
  repeated string context_markers = 9;
  Confidence confidence = 10;
  optional uint64 expires_at_ms = 11;
  optional float sender_reputation_hint = 12;
  repeated string correlation_findings = 13;
  RelayResponseAuth auth = 14;
}

message ThreatScore {
  ThreatType threat_type = 1;
  float score = 2;
}

message DetectionSignal {
  ThreatType threat_type = 1;
  float score = 2;
  Confidence confidence = 3;
  DetectionLayer layer = 4;
  SignalFamily family = 5;
  string reason_code = 6;
  string explanation = 7;
  // Fine-grained subtype within the threat category (e.g., "war_denial", "phishing_diia")
  string threat_subtype = 8;
}

message RiskBreakdown {
  float content = 1;
  float conversation = 2;
  float link = 3;
  float abuse = 4;
}

message ContactSnapshot {
  string sender_id = 1;
  float rating = 2;
  float trust_level = 3;
  CircleTier circle_tier = 4;
  BehavioralTrend trend = 5;
  bool is_trusted = 6;
  bool is_new_contact = 7;
  uint64 first_seen_ms = 8;
  uint64 last_seen_ms = 9;
  uint64 conversation_count = 10;
}

message ActionRecommendation {
  AlertPriority parent_alert = 1;
  repeated FollowUpAction follow_ups = 2;
  bool crisis_resources = 3;
  repeated UiAction ui_actions = 4;
  repeated string reason_codes = 5;
}

message LatentStateEvidence {
  LatentStateKind kind = 1;
  float score = 2;
  repeated string reason_codes = 3;
}

message InferenceSummary {
  UncertaintyLevel uncertainty = 1;
  RiskHorizon risk_horizon = 2;
  float escalation_likelihood_24h = 3;
  float protective_factor_strength = 4;
  repeated LatentStateEvidence latent_states = 5;
}

message KidsMemoryExplainability {
  // Normalized KIDS memory reason codes observed in this decision
  // (without the optional "domain." prefix).
  repeated string reason_codes = 1;
  // True when at least one observed reason is part of the mandatory
  // guardian-escalation KIDS memory contract.
  bool mandatory_guardian_escalation = 2;
  // Cumulative risk score for this conversation from kids memory tracking.
  float conversation_risk_score = 3;
  // Kids-specific sender risk from cross-conversation tracking.
  float sender_risk_score = 4;
  // Number of messages that contributed to this escalation decision.
  uint32 escalation_message_count = 5;
}

message ProductChildSurface {
  ProductDeliveryMode delivery_mode = 1;
  bool visible = 2;
  ProductChildIntervention intervention = 3;
  repeated UiAction ui_actions = 4;
  repeated string reason_codes = 5;
}

message ProductGuardianSurface {
  ProductDeliveryMode delivery_mode = 1;
  bool notify = 2;
  AlertPriority priority = 3;
  repeated FollowUpAction follow_ups = 4;
  repeated string reason_codes = 5;
}

message ProductReviewSurface {
  ProductDeliveryMode delivery_mode = 1;
  bool open_review = 2;
  ProductReviewUrgency urgency = 3;
  repeated string reason_codes = 4;
  repeated LatentStateKind latent_states = 5;
}

message ProductDecisionSurface {
  string schema_version = 1;
  ProductRolloutMode rollout_mode = 2;
  ThreatType threat_type = 3;
  Action action = 4;
  float score = 5;
  ProductChildSurface child = 6;
  ProductGuardianSurface guardian = 7;
  ProductReviewSurface review = 8;
  ProductUncertaintyDisposition uncertainty_disposition = 9;
}

message AnalysisResult {
  ThreatType threat_type = 1;
  Confidence confidence = 2;
  Action action = 3;
  float score = 4;
  string explanation = 5;
  repeated ThreatScore detected_threats = 6;
  repeated DetectionSignal signals = 7;
  ActionRecommendation recommended_action = 8;
  RiskBreakdown risk_breakdown = 9;
  ContactSnapshot contact_snapshot = 10;
  repeated string reason_codes = 11;
  uint64 analysis_time_us = 12;
  InferenceSummary inference = 13;
  ProductDecisionSurface product_surface = 14;
  // Optional explainability helper for KIDS memory escalations.
  KidsMemoryExplainability kids_memory = 15;
}

// Host-owned, content-free identity for exactly-once longitudinal ingestion.
// None of these opaque keys may be derived from message content or a verdict.
message CanonicalSafetyEventIdentity {
  string account_key = 1;
  string subject_key = 2;
  string conversation_key = 3;
  string event_id = 4;
  uint32 revision = 5;
  uint64 occurred_at_ms = 6;
  uint64 observed_at_ms = 7;
}

message CanonicalSafetyAnalyzeRequest {
  MessageInput message = 1;
  CanonicalSafetyEventIdentity identity = 2;
}

enum SafetyCaseLifecycleStatus {
  SAFETY_CASE_LIFECYCLE_STATUS_UNSPECIFIED = 0;
  SAFETY_CASE_LIFECYCLE_STATUS_OBSERVING = 1;
  SAFETY_CASE_LIFECYCLE_STATUS_OPEN = 2;
  SAFETY_CASE_LIFECYCLE_STATUS_ESCALATED = 3;
  SAFETY_CASE_LIFECYCLE_STATUS_URGENT = 4;
  SAFETY_CASE_LIFECYCLE_STATUS_RESOLVED = 5;
  SAFETY_CASE_LIFECYCLE_STATUS_DISMISSED = 6;
}

enum CanonicalSafetyDisposition {
  CANONICAL_SAFETY_DISPOSITION_UNSPECIFIED = 0;
  CANONICAL_SAFETY_DISPOSITION_PROCESSED_IGNORED = 1;
  CANONICAL_SAFETY_DISPOSITION_PROCESSED_REDUCED = 2;
  // Analysis mutated context, but projection was rejected. A durable rejection
  // receipt is retained so the host must not retry this source revision.
  CANONICAL_SAFETY_DISPOSITION_PROCESSED_REJECTED = 3;
  CANONICAL_SAFETY_DISPOSITION_DUPLICATE_IGNORED = 4;
  CANONICAL_SAFETY_DISPOSITION_DUPLICATE_APPLIED = 5;
  CANONICAL_SAFETY_DISPOSITION_DUPLICATE_REJECTED = 6;
  CANONICAL_SAFETY_DISPOSITION_STALE_IGNORED = 7;
}

message CanonicalSafetyAnalyzeResponse {
  CanonicalSafetyDisposition disposition = 1;
  // Present only on the first processed attempt. Duplicate/stale responses are
  // deliberately content-free and never cache an AnalysisResult.
  AnalysisResult local_result = 2;
  optional string ignored_reason = 3;
  optional string case_id = 4;
  optional uint64 case_revision = 5;
  SafetyCaseLifecycleStatus case_status = 6;
  optional uint32 latest_revision = 7;
  // UTF-8 JSON SafetyCaseDecision. It is content-free, versioned by the Rust
  // decision schema, and bounded by the response size contract.
  optional bytes decision_json = 8;
  string runtime_state_schema_version = 9;
  // Present for reduced/applied outcomes. Zero is the legacy initial episode.
  optional uint64 case_generation = 10;
}

// Account-scoped lifecycle mutation allowed at the native boundary.
enum SafetyCaseLifecycleCommandType {
  SAFETY_CASE_LIFECYCLE_COMMAND_TYPE_UNSPECIFIED = 0;
  SAFETY_CASE_LIFECYCLE_COMMAND_TYPE_RESOLVE = 1;
  SAFETY_CASE_LIFECYCLE_COMMAND_TYPE_DISMISS = 2;
}

message SafetyCaseLifecycleCommandRequest {
  string account_key = 1;
  string case_id = 2;
  SafetyCaseLifecycleCommandType command_type = 3;
  uint64 at_ms = 4;
  // Bounded machine-readable code, never user-facing free text.
  string reason_code = 5;
}

message SafetyCaseLifecycleCommandResponse {
  string case_id = 1;
  uint64 case_revision = 2;
  SafetyCaseLifecycleStatus case_status = 3;
  // UTF-8 JSON SafetyCaseDecision, using its embedded decision schema.
  bytes decision_json = 4;
  string runtime_state_schema_version = 5;
  optional uint64 case_generation = 6;
}

enum SafetyCaseSuccessorActivationDisposition {
  SAFETY_CASE_SUCCESSOR_ACTIVATION_DISPOSITION_UNSPECIFIED = 0;
  SAFETY_CASE_SUCCESSOR_ACTIVATION_DISPOSITION_ACTIVATED = 1;
  SAFETY_CASE_SUCCESSOR_ACTIVATION_DISPOSITION_ALREADY_ACTIVATED = 2;
}

// Explicit host-authorized successor activation. Ingestion never invokes it.
message SafetyCaseSuccessorActivationRequest {
  string account_key = 1;
  string predecessor_case_id = 2;
  // Presence is required because generation zero is valid.
  optional uint64 expected_case_generation = 3;
  uint64 expected_case_revision = 4;
  uint64 activated_at_ms = 5;
}

message SafetyCaseSuccessorActivationResponse {
  SafetyCaseSuccessorActivationDisposition disposition = 1;
  string predecessor_case_id = 2;
  uint64 predecessor_case_generation = 3;
  string successor_case_id = 4;
  uint64 successor_case_generation = 5;
  uint64 activated_at_ms = 6;
  string runtime_state_schema_version = 7;
}

message SafetyCaseAccountRemovalRequest {
  string account_key = 1;
}

message SafetyCaseAccountRemovalResponse {
  uint64 removed_cases = 1;
  uint64 removed_source_receipts = 2;
  string runtime_state_schema_version = 3;
}

message ContactProfileRequest {
  string sender_id = 1;
}

message ContactProfile {
  string sender_id = 1;
  float risk_score = 2;
  float rating = 3;
  float trust_level = 4;
  CircleTier circle_tier = 5;
  BehavioralTrend trend = 6;
