name: Promotion Gate

on:
  workflow_dispatch:
    inputs:
      target:
        description: Promotion target
        required: true
        type: choice
        default: staging
        options:
          - staging
          - release
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  AURA_RELEASE_REPORT_PATH: artifacts/release-report.json
  AURA_CONTRACT_EVIDENCE_PATH: artifacts/contract-evidence.json
  AURA_FFI_SMOKE_EVIDENCE_PATH: artifacts/ffi-header-smoke.json
  AURA_FFI_SOAK_EVIDENCE_PATH: artifacts/ffi-state-sync-soak.json
  AURA_DATASET_EVIDENCE_PATH: artifacts/dataset-evidence.json
  AURA_AUDIT_EVIDENCE_PATH: artifacts/audit-evidence.json
  AURA_PILOT_SHADOW_BUNDLE_PATH: artifacts/pilot-shadow-bundle.json
  AURA_PILOT_SHADOW_BUNDLE_PATH_2: artifacts/pilot-shadow-bundle-2.json
  AURA_PILOT_REGRESSION_REPORT_PATH: artifacts/pilot-regression-report.json
  AURA_TEMPORAL_SHADOW_REPORT_PATH: artifacts/temporal-shadow-report.json
  AURA_TEMPORAL_SHADOW_TELEMETRY_VALIDATION_PATH: artifacts/temporal-shadow-telemetry-validation.json
  AURA_KIDS_MEMORY_HEALTH_PATH: artifacts/kids-memory-health.json
  AURA_KIDS_PREPROD_DRY_RUN_PATH: artifacts/kids-preprod-dry-run-matrix.json
  AURA_COMMUNITY_SURFACE_REPORT_PATH: artifacts/community-surface-report.json
  AURA_WORLD_LIFECYCLE_REPORT_PATH: artifacts/world-lifecycle-suite-report.json
  AURA_WORLD_PERFORMANCE_REPORT_PATH: artifacts/performance/world-performance-summary.json
  AURA_REFACTOR_BASELINE_PATH: crates/aura-core/data/refactor_baseline_v1.json
  AURA_REFACTOR_CANDIDATE_PATH: artifacts/refactor-candidate.json
  AURA_REFACTOR_DIFF_REPORT_PATH: artifacts/refactor-diff-report.json
  AURA_REFACTOR_APPROVALS_PATH: docs/refactor-diff-approvals.json
  AURA_PILOT_GATE_REPORT_PATH: artifacts/pilot-gate-report.json
  AURA_PILOT_REVIEW_SIGNOFFS_PATH: artifacts/pilot-review-signoffs.json
  AURA_PILOT_SHADOW_INPUT: crates/aura-core/data/world_sim_2k.json
  AURA_WORLD_LIFECYCLE_INPUT: crates/aura-core/data/world_lifecycle_suite
  AURA_EVIDENCE_MANIFEST_PATH: artifacts/evidence-manifest.json

jobs:
  promotion-gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        persist-credentials: false
    - name: Lint Domain Lexicons
      run: python3 ci/lint_lexicons.py
    - name: Run CI Helper Tests
      run: python3 -m unittest discover -s ci -p 'test_*.py'
    - name: Resolve Promotion Target
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          echo "AURA_PROMOTION_TARGET=${{ inputs.target }}" >> "$GITHUB_ENV"
        else
          echo "AURA_PROMOTION_TARGET=release" >> "$GITHUB_ENV"
        fi
    - name: Build
      run: cargo build --locked --workspace --all-features --all-targets --verbose
    - name: Run tests
      run: cargo test --locked --workspace --all-features --all-targets --verbose
    - name: Run Military Temporal Shadow Gate
      run: bash ci/temporal_shadow_gate.sh
    - name: Run Analyzer Microbenchmark Gate
      run: bash ci/analyzer_microbenchmark_gate.sh
    - name: Run Community Surface Gate
      run: |
        cargo run --locked --quiet --example community_surface_sim -p aura-core -- \
          --profile ci \
          --json "$AURA_COMMUNITY_SURFACE_REPORT_PATH" \
          --fail-on-gate
    - name: Run World Lifecycle Gate
      run: |
        cargo run --locked --quiet --example world_sim -p aura-core -- \
          --input "$AURA_WORLD_LIFECYCLE_INPUT" \
          --summary-only \
          --output "$AURA_WORLD_LIFECYCLE_REPORT_PATH" \
          --redact-text \
          --require-clean
    - name: Run 10k World Performance Gate
      env:
        AURA_PERF_TIERS: 10k
      run: python3 ci/world_performance_gate.py
    - name: Run FFI State Sync Soak
      run: python3 ci/run_ffi_soak.py --output "$AURA_FFI_SOAK_EVIDENCE_PATH" --iterations 5 --label promotion-${AURA_PROMOTION_TARGET}
    - name: Generate Release Report
      if: ${{ always() }}
      run: |
        WORLD_LIFECYCLE_ARGS=""
        if [ -f "$AURA_WORLD_LIFECYCLE_REPORT_PATH" ]; then
          WORLD_LIFECYCLE_ARGS="--world-lifecycle-report $AURA_WORLD_LIFECYCLE_REPORT_PATH"
        fi
        cargo run --locked --quiet --example release_report -p aura-core -- $WORLD_LIFECYCLE_ARGS --output "$AURA_RELEASE_REPORT_PATH" --require-pass
    - name: Generate Contract Evidence
      if: ${{ always() }}
      run: cargo run --locked --quiet --example contract_evidence -p aura-core -- --output "$AURA_CONTRACT_EVIDENCE_PATH"
    - name: Generate Dataset Evidence
      if: ${{ always() }}
      run: python3 ci/generate_dataset_evidence.py --output "$AURA_DATASET_EVIDENCE_PATH"
    - name: Generate Audit Evidence
      if: ${{ always() }}
      run: cargo run --locked --quiet --example audit_evidence -p aura-core -- --output "$AURA_AUDIT_EVIDENCE_PATH"
    - name: Generate Pilot Shadow Bundle
      if: ${{ always() }}
      run: |
        cargo run --locked --quiet --example world_sim -p aura-core -- \
          --input "$AURA_PILOT_SHADOW_INPUT" \
          --summary-only \
          --shadow-output "$AURA_PILOT_SHADOW_BUNDLE_PATH" \
          --require-clean
    - name: Generate Pilot Regression Report
      if: ${{ always() }}
      run: |
        cargo run --locked --quiet --example pilot_regression -p aura-core -- \
          --output "$AURA_PILOT_REGRESSION_REPORT_PATH" \
          --require-pass
    - name: Generate Pilot Gate Report
      if: ${{ always() }}
      run: |
        if [ ! -f "$AURA_PILOT_REVIEW_SIGNOFFS_PATH" ]; then
          echo "pilot review signoffs not present; skipping pilot gate report"
          exit 0
        fi

        cargo run --locked --quiet --example world_sim -p aura-core -- \
          --input "$AURA_PILOT_SHADOW_INPUT" \
          --summary-only \
          --shadow-output "$AURA_PILOT_SHADOW_BUNDLE_PATH_2" \
          --require-clean

        python3 ci/kids_memory_health_snapshot.py \
          --input "$AURA_PILOT_REGRESSION_REPORT_PATH" \
          --input "$AURA_PILOT_SHADOW_BUNDLE_PATH" \
          --input "$AURA_PILOT_SHADOW_BUNDLE_PATH_2" \
          --output "$AURA_KIDS_MEMORY_HEALTH_PATH" \
          --require-mandatory-reasons

        python3 ci/kids_preprod_dry_run_matrix.py \
          --policy-expectations crates/aura-core/data/action_policy_expectations.json \
          --realistic-cases crates/aura-core/data/realistic_chat_cases.json \
          --kids-memory-health "$AURA_KIDS_MEMORY_HEALTH_PATH" \
          --output "$AURA_KIDS_PREPROD_DRY_RUN_PATH"

        cargo run --locked --quiet --example pilot_gate -p aura-core -- \
          --release-report "$AURA_RELEASE_REPORT_PATH" \
          --pilot-regression-report "$AURA_PILOT_REGRESSION_REPORT_PATH" \
          --shadow-bundle "$AURA_PILOT_SHADOW_BUNDLE_PATH" \
          --shadow-bundle "$AURA_PILOT_SHADOW_BUNDLE_PATH_2" \
          --review-signoffs "$AURA_PILOT_REVIEW_SIGNOFFS_PATH" \
          --release-revision "$GITHUB_SHA" \
          --kids-memory-health-report "$AURA_KIDS_MEMORY_HEALTH_PATH" \
          --kids-preprod-dry-run-report "$AURA_KIDS_PREPROD_DRY_RUN_PATH" \
          --output "$AURA_PILOT_GATE_REPORT_PATH" \
          --require-kids-memory-pass \
          --require-kids-preprod-dry-run-pass \
          --require-pass
    - name: Compile FFI Header Smoke
      if: ${{ always() }}
      run: |
        mkdir -p artifacts
        cc -std=c11 -Wall -Wextra -pedantic -I. -c ci/ffi_header_smoke.c -o artifacts/ffi-header-smoke.o

        python3 - <<'PY'
        import json
        import os
        import pathlib
        import subprocess

        compiler = subprocess.check_output(["cc", "--version"], text=True).splitlines()[0]
        evidence = {
            "status": "pass",
            "compiler": compiler,
            "header_path": "include/aura_ffi.h",
            "source_path": "ci/ffi_header_smoke.c",
            "object_path": "artifacts/ffi-header-smoke.o",
        }
        pathlib.Path(os.environ["AURA_FFI_SMOKE_EVIDENCE_PATH"]).write_text(
            json.dumps(evidence, indent=2) + "\n",
            encoding="utf-8",
        )
        PY
    - name: Run AURA Core Refactor Differential Gate
      if: ${{ always() }}
      run: |
        python3 ci/refactor_baseline.py snapshot \
          --output "$AURA_REFACTOR_CANDIDATE_PATH" \
          --baseline-id "promotion-${AURA_PROMOTION_TARGET}-${GITHUB_SHA}" \
          --contract-evidence "$AURA_CONTRACT_EVIDENCE_PATH" \
          --release-report "$AURA_RELEASE_REPORT_PATH" \
          --pilot-regression-report "$AURA_PILOT_REGRESSION_REPORT_PATH" \
          --world-lifecycle-report "$AURA_WORLD_LIFECYCLE_REPORT_PATH" \
          --world-performance-report "$AURA_WORLD_PERFORMANCE_REPORT_PATH"

        APPROVAL_ARGS=()
        if [ -f "$AURA_REFACTOR_APPROVALS_PATH" ]; then
          APPROVAL_ARGS=(--approvals "$AURA_REFACTOR_APPROVALS_PATH")
        fi
        python3 ci/refactor_baseline.py compare \
          --baseline "$AURA_REFACTOR_BASELINE_PATH" \
          --candidate "$AURA_REFACTOR_CANDIDATE_PATH" \
          --output "$AURA_REFACTOR_DIFF_REPORT_PATH" \
          "${APPROVAL_ARGS[@]}" \
          --require-pass
    - name: Generate Evidence Manifest
      if: ${{ always() }}
      run: |
        PILOT_GATE_ARGS=""
        if [ -f "$AURA_PILOT_GATE_REPORT_PATH" ]; then
          PILOT_GATE_ARGS="--pilot-gate-report $AURA_PILOT_GATE_REPORT_PATH"
        fi
        KIDS_PREPROD_ARGS=""
        if [ -f "$AURA_KIDS_PREPROD_DRY_RUN_PATH" ]; then
          KIDS_PREPROD_ARGS="--kids-preprod-dry-run-report $AURA_KIDS_PREPROD_DRY_RUN_PATH"
        fi

        python3 ci/generate_evidence_manifest.py \
          --output "$AURA_EVIDENCE_MANIFEST_PATH" \
          --label "promotion-${AURA_PROMOTION_TARGET}" \
          --release-report "$AURA_RELEASE_REPORT_PATH" \
          --contract-evidence "$AURA_CONTRACT_EVIDENCE_PATH" \
          --ffi-soak "$AURA_FFI_SOAK_EVIDENCE_PATH" \
          --dataset-evidence "$AURA_DATASET_EVIDENCE_PATH" \
          --audit-evidence "$AURA_AUDIT_EVIDENCE_PATH" \
          --pilot-shadow-bundle "$AURA_PILOT_SHADOW_BUNDLE_PATH" \
          --pilot-regression-report "$AURA_PILOT_REGRESSION_REPORT_PATH" \
          --temporal-shadow-report "$AURA_TEMPORAL_SHADOW_REPORT_PATH" \
          --temporal-shadow-telemetry-validation "$AURA_TEMPORAL_SHADOW_TELEMETRY_VALIDATION_PATH" \
          $PILOT_GATE_ARGS \
          $KIDS_PREPROD_ARGS \
          --community-surface-report "$AURA_COMMUNITY_SURFACE_REPORT_PATH" \
          --world-lifecycle-report "$AURA_WORLD_LIFECYCLE_REPORT_PATH" \
          --world-performance-report "$AURA_WORLD_PERFORMANCE_REPORT_PATH" \
          --refactor-diff-report "$AURA_REFACTOR_DIFF_REPORT_PATH" \
          --ffi-smoke "$AURA_FFI_SMOKE_EVIDENCE_PATH"
    - name: Summarize Promotion Gate
      if: ${{ always() }}
      run: |
        if [ ! -f "$AURA_EVIDENCE_MANIFEST_PATH" ]; then
          {
            echo "## AURA Promotion Gate"
            echo
            echo "- target: \`${AURA_PROMOTION_TARGET}\`"
            echo "- evidence manifest: missing"
            echo "- release report: $([ -f "$AURA_RELEASE_REPORT_PATH" ] && echo present || echo missing)"
            echo "- contract evidence: $([ -f "$AURA_CONTRACT_EVIDENCE_PATH" ] && echo present || echo missing)"
            echo "- dataset evidence: $([ -f "$AURA_DATASET_EVIDENCE_PATH" ] && echo present || echo missing)"
            echo "- audit evidence: $([ -f "$AURA_AUDIT_EVIDENCE_PATH" ] && echo present || echo missing)"
            echo "- pilot shadow bundle: $([ -f "$AURA_PILOT_SHADOW_BUNDLE_PATH" ] && echo present || echo missing)"
            echo "- pilot regression report: $([ -f "$AURA_PILOT_REGRESSION_REPORT_PATH" ] && echo present || echo missing)"
            echo "- community surface report: $([ -f "$AURA_COMMUNITY_SURFACE_REPORT_PATH" ] && echo present || echo missing)"
            echo "- world lifecycle report: $([ -f "$AURA_WORLD_LIFECYCLE_REPORT_PATH" ] && echo present || echo missing)"
            echo "- ffi smoke evidence: $([ -f "$AURA_FFI_SMOKE_EVIDENCE_PATH" ] && echo present || echo missing)"
            echo "- ffi soak evidence: $([ -f "$AURA_FFI_SOAK_EVIDENCE_PATH" ] && echo present || echo missing)"
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        python3 - <<'PY'
        import json
        import os
        import pathlib

        manifest = json.loads(
            pathlib.Path(os.environ["AURA_EVIDENCE_MANIFEST_PATH"]).read_text(encoding="utf-8")
        )
        summary_data = manifest["summary"]
        artifacts = manifest.get("artifacts", {})
        soak_artifact = artifacts.get("ffi_soak", {})

        with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
            summary.write("## AURA Promotion Gate\n\n")
            summary.write(f"- target: `{os.environ['AURA_PROMOTION_TARGET']}`\n")
            summary.write(f"- evidence_status: `{manifest['evidence_status']}`\n")
            summary.write(f"- schema_version: `{manifest['schema_version']}`\n")
            summary.write(f"- generated_at_utc: `{manifest['generated_at_utc']}`\n")
            summary.write(f"- overall_status: `{summary_data['release_report_status']}`\n")
            summary.write(f"- release_report_schema_version: `{summary_data['release_report_schema_version']}`\n")
            summary.write(f"- runtime_release_version: `{summary_data['runtime_release_version']}`\n")
            summary.write(f"- wire_package: `{summary_data['wire_package']}`\n")
            summary.write(f"- wire_major_version: `{summary_data['wire_major_version']}`\n")
            summary.write(f"- state_schema_version: `{summary_data['state_schema_version']}`\n")
            summary.write(f"- ffi_export_count: `{summary_data['ffi_export_count']}`\n")
            summary.write(f"- ffi_request_limit_count: `{summary_data['ffi_request_limit_count']}`\n")
            summary.write(f"- import_context_max_bytes: `{summary_data['ffi_import_context_max_bytes']}`\n")
            summary.write(f"- dataset_evidence: `{summary_data['dataset_evidence_status']}`\n")
            summary.write(f"- audit_evidence: `{summary_data['audit_evidence_status']}`\n")
            summary.write(f"- audit_forbidden_fields_absent: `{summary_data['audit_forbidden_fields_absent']}`\n")
            summary.write(f"- temporal_shadow: `{summary_data.get('temporal_shadow_status', 'missing')}`\n")
            summary.write(f"- temporal_shadow_cases: `{summary_data.get('temporal_shadow_case_count', 'missing')}`\n")
            summary.write(f"- temporal_shadow_adversarial_variants: `{summary_data.get('temporal_shadow_adversarial_variant_count', 'missing')}`\n")
            summary.write(f"- temporal_shadow_adversarial_mismatches: `{summary_data.get('temporal_shadow_adversarial_mismatch_count', 'missing')}`\n")
            summary.write(f"- temporal_shadow_telemetry_validation: `{summary_data.get('temporal_shadow_telemetry_validation_status', 'missing')}`\n")
            summary.write(f"- temporal_study_timestamp: `{summary_data.get('temporal_study_timestamp_verification_status', 'missing')}`\n")
            summary.write(f"- temporal_study_timestamp_latest_trusted_time_ms: `{summary_data.get('temporal_study_timestamp_latest_trusted_time_unix_ms', 'missing')}`\n")
            summary.write(f"- temporal_study_timestamp_revocation: `{summary_data.get('temporal_study_timestamp_revocation_assurance', 'missing')}`\n")
            summary.write(f"- temporal_review_receipt_chain: `{summary_data.get('temporal_review_receipt_chain_verification_status', 'missing')}`\n")
            summary.write(f"- temporal_review_receipt_chronology_assurance: `{summary_data.get('temporal_review_receipt_chronology_assurance', 'missing')}`\n")
            summary.write(f"- temporal_review_roster_assurance: `{summary_data.get('temporal_review_roster_assurance', 'missing')}`\n")
            summary.write(f"- temporal_review_receipt_revocation: `{summary_data.get('temporal_review_receipt_revocation_assurance', 'missing')}`\n")
            summary.write(f"- temporal_review_receipt_revocation_checked_timestamps: `{summary_data.get('temporal_review_receipt_revocation_checked_timestamp_count', 'missing')}`\n")
            summary.write(f"- temporal_policy_activation_readiness: `{summary_data.get('temporal_policy_activation_readiness', 'missing')}`\n")
            summary.write(f"- temporal_shadow_telemetry_on_prem_inputs: `{summary_data.get('temporal_shadow_telemetry_on_prem_inputs', 'missing')}`\n")
            summary.write(f"- temporal_shadow_telemetry_adk_inputs: `{summary_data.get('temporal_shadow_telemetry_adk_inputs', 'missing')}`\n")
            summary.write("- evidence_attestation: `external_post_freeze`\n")
            summary.write(f"- pilot_shadow_bundle: `{summary_data['pilot_shadow_status']}`\n")
            summary.write(f"- pilot_shadow_total_events: `{summary_data['pilot_shadow_total_events']}`\n")
            summary.write(f"- pilot_shadow_finding_count: `{summary_data['pilot_shadow_finding_count']}`\n")
            summary.write(f"- pilot_regression: `{summary_data['pilot_regression_status']}`\n")
            summary.write(f"- pilot_regression_scenarios: `{summary_data['pilot_regression_scenario_count']}`\n")
            summary.write(f"- pilot_gate: `{summary_data.get('pilot_gate_status', 'missing')}`\n")
            summary.write(f"- pilot_gate_shadow_runs: `{summary_data.get('pilot_gate_shadow_run_count', 'missing')}`\n")
            summary.write(f"- kids_preprod_dry_run: `{summary_data.get('kids_preprod_dry_run_status', 'missing')}`\n")
            summary.write(f"- kids_preprod_dry_run_checks_failed: `{summary_data.get('kids_preprod_dry_run_checks_failed', 'missing')}`\n")
            summary.write(f"- community_surface: `{summary_data.get('community_surface_status', 'missing')}`\n")
            summary.write(f"- community_surface_total_events: `{summary_data.get('community_surface_total_events', 'missing')}`\n")
            summary.write(f"- community_surface_findings: `{summary_data.get('community_surface_finding_count', 'missing')}`\n")
            summary.write(f"- community_surface_scenarios: `{summary_data.get('community_surface_scenario_count', 'missing')}`\n")
            summary.write(f"- world_lifecycle: `{summary_data.get('world_lifecycle_status', 'missing')}`\n")
            summary.write(f"- world_lifecycle_worlds: `{summary_data.get('world_lifecycle_total_worlds', 'missing')}`\n")
            summary.write(f"- world_lifecycle_total_events: `{summary_data.get('world_lifecycle_total_events', 'missing')}`\n")
            summary.write(f"- world_lifecycle_findings: `{summary_data.get('world_lifecycle_finding_count', 'missing')}`\n")
            summary.write(f"- world_performance: `{summary_data.get('world_performance_status', 'missing')}`\n")
            summary.write(f"- world_performance_tiers: `{summary_data.get('world_performance_tier_count', 'missing')}`\n")
            summary.write(f"- refactor_diff: `{summary_data.get('refactor_diff_status', 'missing')}`\n")
            summary.write(f"- refactor_changes: `{summary_data.get('refactor_diff_change_count', 'missing')}`\n")
            summary.write(f"- refactor_regressions: `{summary_data.get('refactor_diff_regression_count', 'missing')}`\n")
            summary.write(f"- ffi_header_smoke: `{summary_data['ffi_smoke_status']}`\n")
            summary.write(f"- ffi_state_sync_soak: `{summary_data['ffi_soak_status']}`\n")
            summary.write(f"- ffi_state_sync_iterations: `{summary_data['ffi_soak_iterations']}`\n")
            summary.write(f"- ffi_state_sync_attempts: `{summary_data['ffi_soak_attempts_run']}`\n")
            if summary_data["ffi_soak_status"] != "pass":
                summary.write(f"- ffi_state_sync_failure_category: `{summary_data.get('ffi_soak_failure_category', 'missing')}`\n")
                summary.write(f"- ffi_state_sync_failure_summary: `{summary_data.get('ffi_soak_failure_summary', 'missing')}`\n")
                highlights = soak_artifact.get("failure_highlights", [])
                if highlights:
                    summary.write("- ffi_state_sync_highlights:\n")
                    for highlight in highlights[:4]:
                        summary.write(f"  - `{highlight}`\n")
        PY
    - name: Upload Promotion Evidence
      if: ${{ always() }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      with:
        name: aura-promotion-evidence-${{ env.AURA_PROMOTION_TARGET }}
        path: |
          ${{ env.AURA_RELEASE_REPORT_PATH }}
          ${{ env.AURA_CONTRACT_EVIDENCE_PATH }}
          ${{ env.AURA_DATASET_EVIDENCE_PATH }}
          ${{ env.AURA_AUDIT_EVIDENCE_PATH }}
          ${{ env.AURA_PILOT_SHADOW_BUNDLE_PATH }}
          ${{ env.AURA_PILOT_REGRESSION_REPORT_PATH }}
          ${{ env.AURA_TEMPORAL_SHADOW_REPORT_PATH }}
          ${{ env.AURA_TEMPORAL_SHADOW_TELEMETRY_VALIDATION_PATH }}
          ${{ env.AURA_KIDS_MEMORY_HEALTH_PATH }}
          ${{ env.AURA_KIDS_PREPROD_DRY_RUN_PATH }}
          ${{ env.AURA_COMMUNITY_SURFACE_REPORT_PATH }}
          ${{ env.AURA_WORLD_LIFECYCLE_REPORT_PATH }}
          ${{ env.AURA_WORLD_PERFORMANCE_REPORT_PATH }}
          ${{ env.AURA_PILOT_GATE_REPORT_PATH }}
          ${{ env.AURA_REFACTOR_CANDIDATE_PATH }}
          ${{ env.AURA_REFACTOR_DIFF_REPORT_PATH }}
          ${{ env.AURA_FFI_SMOKE_EVIDENCE_PATH }}
          ${{ env.AURA_FFI_SOAK_EVIDENCE_PATH }}
          ${{ env.AURA_EVIDENCE_MANIFEST_PATH }}
        if-no-files-found: warn
